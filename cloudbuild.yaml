# Build and deploy the First AD API to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE=firstad-api
#
# This file exists because `gcloud run deploy --source .` looks for a Dockerfile
# at the repository root, and ours lives at services/api/Dockerfile. It has to
# build from the root regardless, because the API resolves the sample screenplay
# and any bundled recorded run relative to the repository layout.

substitutions:
  _REGION: us-central1
  _SERVICE: firstad-api
  _REPO: firstad
  # Set to TRUE to route Gemini through Vertex AI on this project instead of an
  # API key. Vertex is the better production path: no key to leak, and access
  # is governed by the service account's IAM role.
  _USE_VERTEX: "TRUE"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"

steps:
  # The Artifact Registry repository has to exist before the first push, and
  # creating it is idempotent, so it is done here rather than in a runbook step
  # someone will forget.
  - id: ensure-repo
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe "${_REPO}" \
          --location="${_REGION}" >/dev/null 2>&1 && exit 0
        gcloud artifacts repositories create "${_REPO}" \
          --repository-format=docker \
          --location="${_REGION}" \
          --description="First AD container images"

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/api/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # A feature-length script runs well past the 300s default. Nine agents,
      # several of them retrying against a rate limit, need the headroom.
      - --timeout=900
      - --memory=1Gi
      - --cpu=1
      # One request at a time per instance. A run holds in-process state for its
      # duration, and Cloud Run scales by adding instances rather than threads.
      - --concurrency=1
      - --max-instances=4
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=${_USE_VERTEX},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION}
      # Keys never travel as plain env vars. Create these first:
      #   echo -n "$KEY" | gcloud secrets create parallel-api-key --data-file=-
      - --set-secrets=PARALLEL_API_KEY=parallel-api-key:latest

timeout: 1200s
